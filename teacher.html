<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

SERVER HERO RACE™
Teacher Dashboard

</title>

<link
rel="stylesheet"
href="game.css">

</head>

<body>

<main class="screen">

<div class="teacher-wrap">

<!-- ================= HEADER ================= -->

<header class="topbar">

<div>

<h1>

👨‍🏫 SERVER HERO RACE™

</h1>

<p>

Teacher Dashboard

</p>

</div>

<div class="row">

<a
href="index.html"
class="linkbtn">

👨‍🎓 Pelajar

</a>

<button
id="fullscreenBtn">

⛶ Fullscreen

</button>

</div>

</header>

<!-- ================= ROOM ================= -->

<section class="teacher-grid">

<div class="panel">

<h2>

🏁 BILIK PERLUMBAAN

</h2>

<input
id="teacherName"
placeholder="Nama Guru">

<input
id="newRoomCode"
placeholder="Kod Bilik">

<button
id="createRoomBtn"
class="primary">

🚀 CIPTA BILIK

</button>

<p
id="roomStatus">

Belum membuka bilik.

</p>

</div>

<div class="panel">

<h2>

🎮 KAWALAN GURU

</h2>

<div class="row">

<button
id="approveAllBtn">

✅ APPROVE ALL

</button>

<button
id="startRaceBtn"
class="primary">

🚦 START

</button>

<button
id="finishRaceBtn">

🏁 FINISH

</button>

<button
id="exportCsvBtn">

📊 EXPORT

</button>

</div>

</div>

</section>

<!-- ================= STAT ================= -->

<section class="teacher-grid">

<div class="panel">

<h2>

📊 STATISTIK

</h2>

<div class="stats">

<span>

👨‍🎓

<br>

<b id="totalStudents">

0

</b>

</span>

<span>

✅

<br>

<b id="approvedStudents">

0

</b>

</span>

<span>

🏎️

<br>

<b id="racingStudents">

0

</b>

</span>

<span>

🏁

<br>

<b id="finishedStudents">

0

</b>

</span>

</div>

</div>

<div class="panel">

<h2>

🥇 LIVE LEADERBOARD

</h2>

<div
id="liveLeaderboard">

Tiada pemain.

</div>

</div>

</section>

<!-- ================= STUDENT ================= -->

<section class="panel">

<h2>

👨‍🎓 PELAJAR

</h2>

<div
id="summary"
class="summary">

</div>

<div
id="studentList">

</div>

</section>

<!-- ================= LIVE RACE ================= -->

<section class="teacher-grid">

<div class="panel">

<h2>

🏎️ LIVE RACE TRACK

</h2>

<div
id="raceTrack"
class="track">

<div class="lane"></div>
<div class="lane"></div>
<div class="lane"></div>
<div class="lane"></div>
<div class="lane"></div>
<div class="lane"></div>
<div class="lane"></div>
<div class="lane"></div>
<div class="lane"></div>
<div class="lane"></div>

</div>

</div>

<div class="panel">

<h2>

🏆 TOP 3

</h2>

<div
id="podium">

<div class="result">

<div class="trophy">

🥇

</div>

<h3
id="firstPlace">

-

</h3>

</div>

<hr>

<div class="result">

<div class="trophy">

🥈

</div>

<h3
id="secondPlace">

-

</h3>

</div>

<hr>

<div class="result">

<div class="trophy">

🥉

</div>

<h3
id="thirdPlace">

-

</h3>

</div>

</div>

</div>

</section>

<!-- ================= QR ================= -->

<section class="teacher-grid">

<div class="panel">

<h2>

📱 QR CODE

</h2>

<div
id="qrBox">

QR CODE

</div>

</div>

<div class="panel">

<h2>

🔗 LINK PELAJAR

</h2>

<input

id="joinLink"

readonly>

<button

id="copyLinkBtn">

📋 COPY LINK

</button>

</div>

</section>

</main>

<!-- ================= SCRIPTS ================= -->

<script src="firebase-config.js"></script>

<script src="questions.js"></script>

<script src="teacher.js"></script>

<script>

document
.getElementById("fullscreenBtn")
.onclick=function(){

if(!document.fullscreenElement){

document.documentElement
.requestFullscreen();

}else{

document.exitFullscreen();

}

};

document
.getElementById("copyLinkBtn")
.onclick=function(){

const box=
document.getElementById("joinLink");

box.select();

document.execCommand("copy");

this.innerHTML="✅ DISALIN";

setTimeout(()=>{

this.innerHTML="📋 COPY LINK";

},1500);

};

</script>

</body>

</html>
