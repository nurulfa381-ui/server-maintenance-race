<!DOCTYPE html>
<html lang="ms">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#06152d"
    >

    <title>
        SERVER HERO RACE™ — Panel Guru
    </title>

    <link
        rel="stylesheet"
        href="game.css"
    >

</head>


<body>

<main class="screen">

    <div class="teacher-wrap">


        <!-- HEADER -->

        <header class="topbar">

            <div>

                <h1>
                    👨‍🏫 SERVER HERO RACE™
                </h1>

                <p>
                    Teacher Dashboard
                </p>

            </div>


            <div class="row">

                <a
                    href="index.html"
                    class="linkbtn"
                >
                    👨‍🎓 Paparan Pelajar
                </a>


                <button
                    id="fullscreenBtn"
                    type="button"
                >
                    ⛶ Fullscreen
                </button>

            </div>

        </header>



        <!-- ROOM + CONTROL -->

        <section class="teacher-grid">


            <div class="panel">

                <h2>
                    🏁 Bilik Perlumbaan
                </h2>


                <input
                    id="teacherName"
                    type="text"
                    placeholder="Nama Guru"
                >


                <input
                    id="newRoomCode"
                    type="text"
                    placeholder="Kod Bilik"
                >


                <button
                    id="createRoomBtn"
                    type="button"
                    class="primary"
                >
                    🚀 Cipta / Buka Bilik
                </button>


                <p id="roomStatus">
                    Belum membuka bilik.
                </p>

            </div>



            <div class="panel">

                <h2>
                    🎮 Kawalan Guru
                </h2>


                <div class="row">

                    <button
                        id="approveAllBtn"
                        type="button"
                    >
                        ✅ Approve All
                    </button>


                    <button
                        id="startRaceBtn"
                        type="button"
                        class="primary"
                    >
                        🚦 Start Race
                    </button>


                    <button
                        id="finishRaceBtn"
                        type="button"
                    >
                        🏁 Finish
                    </button>


                    <button
                        id="exportCsvBtn"
                        type="button"
                    >
                        📊 Export CSV
                    </button>

                </div>

            </div>

        </section>



        <!-- STATISTICS + LEADERBOARD -->

        <section class="teacher-grid">


            <div class="panel">

                <h2>
                    📊 Statistik
                </h2>


                <div class="stats">

                    <span>
                        👨‍🎓
                        <br>
                        <strong id="totalStudents">
                            0
                        </strong>
                    </span>


                    <span>
                        ✅
                        <br>
                        <strong id="approvedStudents">
                            0
                        </strong>
                    </span>


                    <span>
                        🏎️
                        <br>
                        <strong id="racingStudents">
                            0
                        </strong>
                    </span>


                    <span>
                        🏁
                        <br>
                        <strong id="finishedStudents">
                            0
                        </strong>
                    </span>

                </div>

            </div>



            <div class="panel">

                <h2>
                    🥇 Live Leaderboard
                </h2>


                <div id="liveLeaderboard">
                    Tiada pemain.
                </div>

            </div>

        </section>



        <!-- STUDENT LIST -->

        <section class="panel">

            <h2>
                👨‍🎓 Pelajar Dalam Bilik
            </h2>


            <div
                id="summary"
                class="summary"
            >
            </div>


            <div id="studentList">
            </div>

        </section>



        <!-- LIVE TRACK + PODIUM -->

        <section class="teacher-grid">


            <div class="panel">

                <h2>
                    🏎️ Live Race Track
                </h2>


                <div
                    id="raceTrack"
                    class="track"
                >

                    <div class="lane"></div>
                    <div class="lane"></div>
                    <div class="lane"></div>
                    <div class="lane"></div>
                    <div class="lane"></div>
                    <div class="lane"></div>
                    <div class="lane"></div>
                    <div class="lane"></div>
                    <div class="lane"></div>
                    <div class="lane"></div>

                </div>

            </div>



            <div class="panel">

                <h2>
                    🏆 Top 3
                </h2>


                <div id="podium">


                    <div class="result">

                        <div class="trophy">
                            🥇
                        </div>

                        <h3 id="firstPlace">
                            -
                        </h3>

                    </div>



                    <div class="result">

                        <div class="trophy">
                            🥈
                        </div>

                        <h3 id="secondPlace">
                            -
                        </h3>

                    </div>



                    <div class="result">

                        <div class="trophy">
                            🥉
                        </div>

                        <h3 id="thirdPlace">
                            -
                        </h3>

                    </div>


                </div>

            </div>

        </section>



        <!-- LINK -->

        <section class="teacher-grid">


            <div class="panel">

                <h2>
                    📱 QR Code
                </h2>


                <div id="qrBox">
                    QR CODE
                </div>

            </div>



            <div class="panel">

                <h2>
                    🔗 Pautan Pelajar
                </h2>


                <input
                    id="joinLink"
                    type="text"
                    readonly
                    placeholder="Pautan pelajar akan muncul di sini"
                >


                <button
                    id="copyLinkBtn"
                    type="button"
                >
                    📋 Copy Link
                </button>

            </div>

        </section>


    </div>

</main>



<script src="firebase-config.js"></script>

<script src="questions.js"></script>

<script src="teacher.js"></script>


<script>

document
    .getElementById("fullscreenBtn")
    .onclick = function () {

        if (
            !document.fullscreenElement
        ) {

            document
                .documentElement
                .requestFullscreen();

        } else {

            document
                .exitFullscreen();
        }
    };


document
    .getElementById("copyLinkBtn")
    .onclick = function () {

        const box =
            document.getElementById(
                "joinLink"
            );


        box.select();

        document.execCommand(
            "copy"
        );


        this.textContent =
            "✅ DISALIN";


        setTimeout(

            () => {

                this.textContent =
                    "📋 Copy Link";
            },

            1500
        );
    };

</script>


</body>

</html>
