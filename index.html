<!DOCTYPE html>
<html lang="ms">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#06152d"
    >

    <title>
        SERVER HERO RACE™
    </title>

    <link
        rel="stylesheet"
        href="game.css"
    >

</head>


<body>


<!-- =====================================================
     STUDENT JOIN SCREEN
===================================================== -->

<section
    id="joinScreen"
    class="screen center"
>

    <div class="panel">

        <h1>
            🏎️ SERVER HERO RACE™
        </h1>

        <p class="subtitle">
            MULTIPLAYER CLASSROOM EDITION
        </p>


        <div class="row">

            <button
                id="bmBtn"
                type="button"
                class="active"
            >
                🇲🇾 Bahasa Melayu
            </button>


            <button
                id="enBtn"
                type="button"
            >
                🇬🇧 English
            </button>

        </div>


        <input
            id="roomCode"
            type="text"
            placeholder="Kod bilik"
            maxlength="20"
            autocomplete="off"
        >


        <input
            id="playerName"
            type="text"
            placeholder="Nama pelajar"
            maxlength="50"
            autocomplete="name"
        >


        <input
            id="playerId"
            type="text"
            placeholder="ID pelajar"
            maxlength="30"
            autocomplete="off"
        >


        <h3>
            Pilih Avatar
        </h3>


        <div
            id="avatarGrid"
            class="avatars"
        >
        </div>


        <button
            id="joinBtn"
            type="button"
            class="primary"
        >
            MASUK BILIK
        </button>


        <p id="joinMsg">
        </p>

    </div>

</section>



<!-- =====================================================
     WAITING SCREEN
===================================================== -->

<section
    id="waitingScreen"
    class="screen center hidden"
>

    <div class="panel">

        <h1>
            ⏳ Menunggu Kelulusan Guru
        </h1>

        <p id="waitingInfo">
            Menunggu...
        </p>


        <div class="loader">
        </div>


        <p>
            Jangan tutup halaman ini.
        </p>

    </div>

</section>



<!-- =====================================================
     GAME SCREEN
===================================================== -->

<section
    id="gameScreen"
    class="screen hidden"
>


    <!-- PLAYER HEADER -->

    <header class="topbar">

        <div>

            <h2 id="displayName">
                Pemain
            </h2>

            <p>
                Bilik:
                <strong id="displayRoom">
                    -
                </strong>
            </p>

        </div>


        <div class="stats">

            <span>
                🏆 Markah
                <br>
                <strong id="score">
                    0
                </strong>
            </span>


            <span>
                ⭐ XP
                <br>
                <strong id="xp">
                    0
                </strong>
            </span>


            <span>
                📍 Kedudukan
                <br>
                <strong id="rank">
                    #-
                </strong>
            </span>

        </div>

    </header>



    <!-- LIVE RACE TRACK -->

    <section
        id="raceTrack"
        class="track"
    >
    </section>



    <!-- QUESTION -->

    <section
        id="questionArea"
        class="question-card"
    >

        <h2>
            Menunggu soalan...
        </h2>

    </section>



    <!-- BYTE -->

    <section id="byteArea">
    </section>


</section>



<!-- =====================================================
     RESULT SCREEN
===================================================== -->

<section
    id="resultScreen"
    class="screen center hidden"
>

    <div class="panel result">

        <h1>
            🏁 PERLUMBAAN TAMAT
        </h1>


        <div
            id="trophy"
            class="trophy"
        >
            🏁
        </div>


        <h2 id="finalRank">
            Kedudukan #-
        </h2>


        <p id="finalStats">
            Markah 0 • XP 0
        </p>


        <a
            href="index.html"
            class="linkbtn"
        >
            MAIN SEMULA
        </a>

    </div>

</section>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="firebase-config.js"></script>

<script src="questions.js"></script>

<script src="byte.js"></script>

<script src="multiplayer.js"></script>

<script src="game.js"></script>


</body>

</html>
