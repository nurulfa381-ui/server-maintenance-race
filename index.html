<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SERVER HERO RACE v2</title><link rel="stylesheet" href="game.css"></head><body>
<main><section id="joinScreen" class="screen center"><div class="panel"><h1>🏎️ SERVER HERO RACE™</h1><p>Multiplayer Classroom Edition</p><div class="row"><button id="bmBtn" class="active">🇲🇾 Bahasa Melayu</button><button id="enBtn">🇬🇧 English</button></div><input id="roomCode" placeholder="Kod bilik"><input id="playerName" placeholder="Nama pelajar"><input id="playerId" placeholder="ID pelajar"><div id="avatarGrid" class="avatars"></div><button id="joinBtn" class="primary">MASUK BILIK</button><p id="joinMsg"></p></div></section>
<section id="waitingScreen" class="screen center hidden"><div class="panel"><h2>⏳ Menunggu kelulusan guru</h2><p id="waitingInfo"></p><div class="loader"></div></div></section>
<section id="gameScreen" class="screen hidden"><header class="topbar"><div><strong id="displayName"></strong><br><span id="displayRoom"></span></div><div class="stats"><span>🏆 <b id="score">0</b></span><span>⭐ <b id="xp">0</b></span><span>📍 <b id="rank">#-</b></span></div></header><div id="raceTrack" class="track"></div><section id="questionArea" class="question-card"></section><section id="byteArea"></section></section>
<section id="resultScreen" class="screen center hidden"><div class="panel result"><h1>🏁 PERLUMBAAN TAMAT</h1><div id="trophy" class="trophy"></div><h2 id="finalRank"></h2><p id="finalStats"></p></div></section></main>
<script src="firebase-config.js"></script><script src="questions.js"></script><script src="byte.js"></script><script src="multiplayer.js"></script><script src="game.js"></script></body></html>
